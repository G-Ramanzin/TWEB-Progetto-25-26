# ============================================================
# OPTIONAL: local databases via Docker.
# If you already have PostgreSQL and MongoDB installed locally
# you can skip this file entirely.
#
# Usage:  docker compose up -d
# ============================================================
services:
  postgres:
    image: postgres:16
    container_name: anime-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: animedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: anime-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
