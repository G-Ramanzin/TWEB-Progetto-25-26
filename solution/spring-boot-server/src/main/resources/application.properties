# ============================================================
# Anime Explorer - Spring Boot Server (static data, PostgreSQL)
# ============================================================

server.port=8080

# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/animedb
spring.datasource.username=postgres
spring.datasource.password=Gabri0802!
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' creates/updates the schema automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- CSV import ---
# Relative path from the spring-boot-server directory to the data folder.
app.data.directory=../../data

# --- Logging ---
logging.level.com.anime=INFO
